name: Auto Versioning & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Chrome Extension
        run: |
          cd extension
          npm ci
          npm run build
          Compress-Archive -Path dist/* -DestinationPath ../fuk-yt-extension.zip -Force

      - name: Build Native Host Engine
        run: |
          cd native-host
          go mod tidy
          go build -ldflags="-s -w" -o bin/native-host.exe ./cmd/host
          Compress-Archive -Path bin/native-host.exe, com.fukyt.host.json, ../install.bat -DestinationPath ../fuk-yt-engine-windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            fuk-yt-extension.zip
            fuk-yt-engine-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
